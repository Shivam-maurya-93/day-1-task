<!DOCTYPE html>
<html lang="en">
<head>
    <title>Even or odd</title>
</head>
<body>
    <script>
        let a=15;
        if(a%2==0)
        {
            document.write("it is a even number");
        }
        else{
            document.write("it is a odd number");
        }
    </script>
</body>
</html>
