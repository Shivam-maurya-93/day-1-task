    <title>Document</title>
</head>
<body>
    <script>
     let mark=90;
     if(mark>=90)
       {document.write("GRADE A");}
     else if(mark<90 && mark>=75)
       {document.write("GRADE B");}
     else if(mark<=74 && mark>=55)
       {document.write("GRADE C");}
     else if(mark<=54 && mark>=33)
       {document.write("GRADE D");}
       else{
        document.write("FAIL");
       }
</script>
