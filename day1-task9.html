<!DOCTYPE html>
<html>
    <head>
        <title>
            countdown 10 to 1 by using do while loop
        </title>
    </head>
    <body>
        <script>
            let a=10;
            do{
                document.write(a,"<br>");
                a--;
            }while(a>=1);
        </script>
    </body>
</html>
